<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="Tela para realizar o Login para a Página">
    <meta name="keywords" content="metatags, HTML, Atividades, Tela, Login">
    <meta name="authot" content="Otávio Augusto">
    <meta name="language" content="pt-br">
    <title>Consulta de Cadastro</title>
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="stylesheet" href="EstiloConsulta.css">
</head>

<body>
    <header>
        <div class="Logo">
            <img src="HTML e CSS.png" alt="Logo do HTML5 e do CSS3" class="Imagem">
        </div>
        <nav>
            <div class="Opcoes">
                <a href="MenuPrincipalAtividades.html" class="Opcao">Home</a>
                <a href="Login.html" class="Opcao">Login</a>
                <a href="Cadastro.html" class="Opcao">Cadastro</a>
            </div>
        </nav>
    </header>

    <!-- Legenda Tabela: -->
    <!--Figure: A table está dento dessa Tag-->
    <!--Table: Inicia a Criação da Tabela-->
    <!--Thead: Inicia a Criação do Cabeçalho da Tabela-->
    <!--Tbody: Inicia a Criação do Corpo da Tabela, onde colocamos os Dados-->
    <!--Tr: Define o começo de uma Linha da Tabela-->
    <!--Th: Define o Cabeçalho da Tabéla, uma célula de Cabeçalho-->
    <!--Td: Define a Criação de um dado de uma célula da Tabela-->

    <main>
        <h1><strong>Consultas Cadastros:</strong></h1>
        <h3>Veja os Usuarios Cadastrados</h3>
        <figure>
            <table border="1">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Senha</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="number" name="Id" id="id"></td>
                        <td><input type="text" name="Nome" id="Nome"></td>
                        <td><input type="email" name="Email" id="Email"></td>
                        <td><input type="password" name="Senha" id="Senha"></td>
                        <td><input type="text" name="Acoes" id="Acoes"></td>
                    </tr>
                </tbody>
            </table>
        </figure>
    </main>

    <footer>

    </footer>
</body>

</html>
