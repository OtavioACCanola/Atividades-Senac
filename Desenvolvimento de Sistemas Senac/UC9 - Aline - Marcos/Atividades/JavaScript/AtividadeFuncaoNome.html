<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Nome Concatenizado</title>
</head>
<body>
    <h1>Função Mensagem por Nome</h1>
    <script>
        function gerarMensagem(nome){
            alert("Olá "+nome+", seja bem-vindo ao sistema!")
        }

        const nomeDigitado = prompt("Digite seu Nome: ")
        gerarMensagem(nomeDigitado)

    </script>
</body>
</html>
