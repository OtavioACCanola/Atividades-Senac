<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Introdução ao JavaScript - UC10</title>
</head>

<body>

    <h1>Explorando o Console do Navegador</h1>

    <!--O Script é inserido aqui, antes do fechamento do body-->
    <script>
        // O comando console.log é a ferramenta principal de debug (depuração)
        console.log("Olá Mundo! O JavaScript está funcionando!")

        const Nome = prompt("Insira seu Nome: ") // Variável que não muda o valor
        let Idade = prompt("Insira sua Idade: ") // Variável que pode mudar o valor
        const Cidade = prompt("Insira o Nome da sua Cidade: ")

        console.log("Nome: " + Nome + "\nIdade: " + Idade + "\nCidade: " + Cidade)

        // OU

        console.log("Nome: " + Nome)
        console.log("Idade: " + Idade)
        console.log("Cidade: " + Cidade)
    
        const aluno = prompt("Qual é seu Nome?")
        console.log("Bem-Vindo ao Curso, " + aluno + "!")
    </script>


</body>

</html>
